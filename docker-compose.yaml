version: '3.8'
services:
  bot-gap:
    build: .
    container_name: bot-gap
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # GAP Dünyası: 3D Discord Activity (web/). Coolify'da bu servise domain verilir.
  world:
    build: ./web
    restart: always
    env_file:
      - .env
    environment:
      - SERVICE_FQDN_WORLD_3000
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
