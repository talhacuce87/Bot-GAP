version: '3.8'
services:
  bot-gap:
    build: .
    container_name: bot-gap
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # GAP Dünyası: 3D Discord Activity (web/). Coolify'da bu servise domain verilir.
  world:
    build: ./web
    restart: always
    env_file:
      - .env
    environment:
      - SERVICE_FQDN_WORLD_3000
      # Hızlı yol (WebRTC/UDP): konum ve snapshot'lar. Sunucunun güvenlik duvarında 40000/udp açık olmalı;
      # kapalıysa istemciler birkaç saniye içinde WebSocket'le devam eder.
      - WORLD_RTC_PORT=40000
      # Casino test coin bakiyeleri gibi küçük kalıcı veriler
      - WORLD_DATA_DIR=/data
    volumes:
      - world-data:/data
    ports:
      - "40000:40000/udp"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  world-data:
